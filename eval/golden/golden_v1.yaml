  # ------------------------------------------------------------------ false premise
  - id: premise-001
    lang: en
    category: false_premise
    question: What does Article 120 of the GDPR say?
    answerable: false
    expected: []
    reference: The GDPR has only 99 articles; Article 120 does not exist.
  - id: premise-002
    lang: en
    category: false_premise
    question: What penalties does Article 70 of DORA provide?
    answerable: false
    expected: []
    reference: DORA has 64 articles; Article 70 does not exist.
  - id: premise-003
    lang: en
    category: false_premise
    question: Why does the GDPR give controllers 48 hours to notify a data breach?
    expected: ["32016R0679:art_33:p1"]
    reference: The premise is wrong; the deadline is 72 hours where feasible (Art. 33(1)).
  - id: premise-004
    lang: en
    category: false_premise
    question: Why does the AI Act ban all use of facial recognition?
    expected: ["32024R1689:art_5:p1"]
    reference: It does not; it prohibits specific practices such as untargeted scraping of facial images and real-time remote biometric identification in public spaces for law enforcement, with exceptions (Art. 5(1)).
  - id: premise-005
    lang: en
    category: false_premise
    question: Given that NIS2 caps fines for essential entities at 4 % of turnover, how are they calculated?
    expected: ["32022L2555:art_34:p4"]
    reference: The premise is wrong; NIS2 sets a maximum of at least EUR 10 million or 2 % of worldwide turnover (Art. 34(4)).
  - id: premise-006
    lang: en
    category: false_premise
    question: Since gatekeepers are eligible third parties under the Data Act, how can they request user data?
    expected: ["32023R2854:art_5:p3"]
    reference: The premise is wrong; gatekeepers designated under the DMA are not eligible third parties (Art. 5(3)).
  - id: premise-007
    lang: fr
    category: false_premise
    question: Pourquoi le DSA ne s'applique-t-il qu'aux plateformes de plus de 10 millions d'utilisateurs ?
    expected: ["32022R2065:art_33:p1"]
    reference: La prémisse est fausse ; le DSA s'applique à tous les services intermédiaires, et le seuil des très grandes plateformes est de 45 millions (art. 33, par. 1).

