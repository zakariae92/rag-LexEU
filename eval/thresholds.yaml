# Retrieval quality gate (`lexeu eval retrieval --gate`, CI job "Eval (retrieval gate)").
# Set from the M3 production config (`dense-recitals-demote`, golden v1, see eval/baselines/)
# minus a ~2-3 point margin for run-to-run noise. Raise them when a change improves the baseline;
# lowering them must be a deliberate, reviewed decision.
overall:
  hit@1: 0.69      # baseline 0.722 (M2: 0.530)
  hit@5: 0.89      # baseline 0.914
  hit@10: 0.93     # baseline 0.954
  recall@10: 0.91  # baseline 0.934
  mrr@10: 0.78     # baseline 0.809 (M2: 0.687)
by_category:
  obligation:
    hit@5: 0.95    # baseline 0.983
  lookup:
    hit@5: 0.88    # baseline 0.912

# Answer quality gate (`lexeu eval answers --gate`), set from the M4 production config
# (gemini-3.1-flash-lite, small-to-big sources, prompt v2; judge gemini-3.8-flash).
# Keys ending in `_max` are upper bounds. With 14 unanswerable items, one miss = -0.07.
answers:
  refusal_recall: 0.90             # baseline 1.000: the "I don't know" must keep working
  false_refusal_rate_max: 0.06     # baseline 0.027
  citation_hit: 0.92               # baseline 0.959
  invalid_citation_rate_max: 0.01  # baseline 0.000: never cite a source that was not given
  correct_or_partial: 0.95         # baseline 1.000 (LLM judge)
  faithful: 0.95                   # baseline 0.993 (LLM judge)
  error_rate_max: 0.05             # baseline 0.012 (provider timeouts)
  latency_total_p95_max: 2000      # baseline 1642 ms end to end
  cost_per_question_usd_max: 0.002 # baseline $0.00079
