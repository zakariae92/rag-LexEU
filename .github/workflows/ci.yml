name: CI/CD

# Pipeline (each job is one box in the Actions graph):
#
#               ┌─► integration ───────────────┐
#   lint ──┐   ├─► eval (retrieval + answers) ─┤
#   types ─┼───┤                               ├─► images (arm64: api, embeddings, ui) ─► deploy
#   test ──┘   └─► build ─► smoke ─────────────┤        (main only)                     (Oracle VM)
#   ui (lint, types, tests) ───────────────────┘
#
#   observability (Prometheus config, alert unit tests, dashboard JSON): independent
#
# A release reaches the VM only if every test and both quality gates pass.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  observability:
    name: Observability config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Prometheus config and alert rules are valid
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/p:ro" -w /p             --entrypoint promtool prom/prometheus:v3.15.0 check config prometheus.yml
      - name: Alert rules unit tests
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/p:ro" -w /p             --entrypoint promtool prom/prometheus:v3.15.0 test rules alerts_test.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -m json.tool observability/grafana/dashboards/lexeu.json > /dev/null

  ui:
    name: UI (lint, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag published
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  types:
    name: Type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    needs: [lint, types, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Start infrastructure (Postgres, Qdrant, Redis, object store)
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 180
      - name: Pytest -m integration (real Postgres + S3, Alembic migrations)
        run: uv run pytest -m integration --no-cov

  eval:
    name: Eval (retrieval + answer gates)
    runs-on: ubuntu-24.04
    needs: [lint, types, test]
    env:
      # Only chunks missing from the restored cache are embedded, on a Modal GPU.
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      # Answer generation and judge. Without the secret the answer gate is skipped, not failed.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Free-tier quotas are per minute as well as per day: a 190-question burst is refused after
      # the first minute. Pace each model (generator, judge) below the lowest published limit.
      GENERATION__REQUESTS_PER_MINUTE: "10"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Start infrastructure + embedding server (TEI, BGE-M3)
        run: |
          cp .env.example .env
          docker compose --profile ml up -d --wait --wait-timeout 600
      - name: Restore embedding cache
        uses: actions/cache@v6
        with:
          path: data/embeddings
          key: embeddings-bge-m3-${{ hashFiles('src/lexeu/ingestion/**', 'src/lexeu/retrieval/index.py') }}
          restore-keys: embeddings-bge-m3-
      - name: Ingest the corpus from Cellar
        run: |
          uv run alembic upgrade head
          uv run lexeu ingest
          uv run lexeu eval validate
      - name: Embed missing chunks (Modal GPU) and build the index
        run: |
          uv run lexeu index embed
          uv run lexeu index build
      - name: Retrieval evaluation with quality gate
        run: uv run lexeu eval retrieval --gate
      - name: Restore LLM response cache
        # Keyed by the exact prompt + sources: only changed questions call the LLM (cost, speed).
        uses: actions/cache@v6
        with:
          path: data/llm
          key: llm-responses-${{ hashFiles('src/lexeu/generation/**', 'src/lexeu/eval/judge.py', 'eval/golden/*.yaml') }}
          restore-keys: llm-responses-
      - name: Answer evaluation with quality gate
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::GEMINI_API_KEY secret not set: answer gate skipped"
            exit 0
          fi
          uv run lexeu eval answers --gate
      - name: Publish the reports
        if: always()
        run: |
          cat eval/reports/retrieval_latest.md >> "$GITHUB_STEP_SUMMARY" || true
          cat eval/reports/answers_latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-reports
          path: eval/reports/
          if-no-files-found: ignore

  build:
    name: Build image
    runs-on: ubuntu-24.04
    needs: [lint, types, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          tags: rag-lexeu-api:local
          outputs: type=docker,dest=${{ runner.temp }}/api-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: api-image
          path: ${{ runner.temp }}/api-image.tar
          retention-days: 1

  smoke:
    name: Smoke test (full stack)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: api-image
          path: ${{ runner.temp }}
      - run: docker load --input ${{ runner.temp }}/api-image.tar
      - name: Start stack, with the embedding server that /ready checks
        run: |
          cp .env.example .env
          docker compose --profile app --profile ml up -d --no-build --wait --wait-timeout 600
      - name: Check /health and /ready
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready
      - name: Migrate and ingest one act from Cellar (inside the image)
        run: |
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api lexeu ingest --celex 32016R0679
          docker compose run --rm api lexeu corpus status
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app --profile ml logs --no-color

  images:
    name: Image ${{ matrix.image }} (linux/arm64)
    # Native ARM runner: the VM is ARM (Ampere); no slow QEMU emulation.
    runs-on: ubuntu-24.04-arm
    needs: [integration, eval, smoke, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: .
            file: docker/api.Dockerfile
          - image: embeddings
            context: .
            file: docker/embeddings.Dockerfile
          - image: ui
            context: ui
            file: ui/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/rag-lexeu-${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/rag-lexeu-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-arm64
          cache-to: type=gha,scope=${{ matrix.image }}-arm64,mode=max

  deploy:
    name: Deploy (Oracle VM)
    runs-on: ubuntu-24.04
    needs: images
    # Configured in Settings > Secrets and variables > Actions; skipped until then (docs/deploy.md).
    if: vars.VM_HOST != ''
    environment:
      name: production
      url: https://${{ vars.LEXEU_DOMAIN }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never interrupt a rollout halfway
    env:
      TARGET: deploy@${{ vars.VM_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH identity (a deploy-only key) and the VM's pinned host key
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the stack definition
        run: scp deploy/compose.prod.yml deploy/Caddyfile "$TARGET:/opt/lexeu/"
      - name: Roll out this commit's images (migrations run first)
        run: |
          ssh "$TARGET" "cd /opt/lexeu \
            && sed -i 's/^LEXEU_TAG=.*/LEXEU_TAG=${{ github.sha }}/' .env \
            && docker compose -f compose.prod.yml pull --quiet \
            && docker compose -f compose.prod.yml up -d --wait --wait-timeout 600 --remove-orphans \
            && docker image prune -f"
      - name: Check the public endpoint
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://${{ vars.LEXEU_DOMAIN }}/ready"
          curl -fsS -o /dev/null "https://${{ vars.LEXEU_DOMAIN }}/"
      - name: State on failure
        if: failure()
        run: ssh "$TARGET" "cd /opt/lexeu && docker compose -f compose.prod.yml ps && docker compose -f compose.prod.yml logs --tail 50 --no-color"
