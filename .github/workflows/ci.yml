name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag published
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov-report=xml

  stack:
    name: Docker build + stack smoke test
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          tags: rag-lexeu-api:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose --profile app up -d --wait --wait-timeout 180

      - name: API is live and all dependencies are ready
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready | tee ready.json
          python3 -c "import json; assert json.load(open('ready.json'))['status'] == 'ready'"

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v
