# Prometheus for the local stack (compose profile `obs`).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: lexeu-api
    metrics_path: /metrics
    static_configs:
      # The API container (profile `app`) and an API started on the host (`uv run poe dev`).
      # Only one usually runs: alerts use `sum(up)` so the other being down is not an incident.
      - targets: ["api:8000"]
        labels: { deployment: container }
      - targets: ["host.docker.internal:8000", "host.docker.internal:8090"]
        labels: { deployment: host }

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
