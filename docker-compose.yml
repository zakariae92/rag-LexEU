# rag-LexEU local stack.
#
#   docker compose up -d --wait                  -> infrastructure only (run the API with `uv run poe dev`)
#   docker compose --profile app up -d --wait    -> infrastructure + API container
#
# Later milestones add profiles: `obs` (Langfuse, Prometheus, Grafana) and `pipeline` (Prefect, MLflow).
# All ports bind to 127.0.0.1: nothing is exposed to the local network.

name: lexeu

x-restart: &restart
  restart: unless-stopped

services:
  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"  # REST
      - "127.0.0.1:6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # image ships without curl; use bash's /dev/tcp
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    <<: *restart
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES__USER:-lexeu}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:-lexeu}
      POSTGRES_DB: ${POSTGRES__DB:-lexeu}
    ports:
      - "127.0.0.1:${POSTGRES__PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *restart
    # Redis 8 ships the Query Engine (vector search) needed for the semantic cache.
    image: redis:8.8.3
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-store:
    <<: *restart
    # S3-compatible raw-document store (see docs/adr/0003-object-storage.md).
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${OBJECT_STORE__ACCESS_KEY:-lexeu}
      RUSTFS_SECRET_KEY: ${OBJECT_STORE__SECRET_KEY:-lexeu-secret}
    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9001:9001"  # web console
    volumes:
      - object_data:/data
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    <<: *restart
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: rag-lexeu-api:local
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network, services are reached by name.
      POSTGRES__HOST: postgres
      POSTGRES__PORT: "5432"
      QDRANT__URL: http://qdrant:6333
      REDIS__URL: redis://redis:6379/0
      OBJECT_STORE__ENDPOINT: http://object-store:9000
      LOG_JSON: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      qdrant: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      object-store: { condition: service_healthy }

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  object_data:
