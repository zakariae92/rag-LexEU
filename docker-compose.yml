# rag-LexEU local stack.
#
#   docker compose up -d --wait                  -> infrastructure only (run the API with `uv run poe dev`)
#   docker compose --profile app up -d --wait    -> infrastructure + API container
#
#   docker compose --profile ml up -d --wait     -> + embedding server (BGE-M3, ~4 GB RAM)
#   docker compose --profile obs up -d --wait    -> + Prometheus, Grafana, Jaeger (~400 MB RAM)
#
# UIs: Grafana http://127.0.0.1:3000, Prometheus http://127.0.0.1:9090, Jaeger http://127.0.0.1:16686
# All ports bind to 127.0.0.1: nothing is exposed to the local network.

name: lexeu

x-restart: &restart
  restart: unless-stopped

services:
  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"  # REST
      - "127.0.0.1:6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # image ships without curl; use bash's /dev/tcp
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    <<: *restart
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES__USER:-lexeu}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:-lexeu}
      POSTGRES_DB: ${POSTGRES__DB:-lexeu}
    ports:
      - "127.0.0.1:${POSTGRES__PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *restart
    # Redis 8 ships the Query Engine (vector search) needed for the semantic cache.
    image: redis:8.8.3
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-store:
    <<: *restart
    # S3-compatible raw-document store (see docs/adr/0003-object-storage.md).
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${OBJECT_STORE__ACCESS_KEY:-lexeu}
      RUSTFS_SECRET_KEY: ${OBJECT_STORE__SECRET_KEY:-lexeu-secret}
    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9001:9001"  # web console
    volumes:
      - object_data:/data
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  embeddings:
    <<: *restart
    profiles: ["ml"]
    # HuggingFace text-embeddings-inference, CPU build (ONNX). Batches are capped because the
    # default warm-up (16k tokens) runs out of memory with BGE-M3 on a 6 GB Docker VM.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    command:
      - --model-id=${EMBEDDINGS__MODEL_ID:-BAAI/bge-m3}
      - --revision=${EMBEDDINGS__REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      - --max-batch-tokens=4096
      - --max-client-batch-size=32
      - --auto-truncate
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - hf_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s

  api:
    <<: *restart
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: rag-lexeu-api:local
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network, services are reached by name.
      POSTGRES__HOST: postgres
      POSTGRES__PORT: "5432"
      QDRANT__URL: http://qdrant:6333
      REDIS__URL: redis://redis:6379/0
      OBJECT_STORE__ENDPOINT: http://object-store:9000
      EMBEDDINGS__URL: http://embeddings:80
      TRACING__OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_JSON: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      qdrant: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      object-store: { condition: service_healthy }

  # ------------------------------------------------------------------ observability (M6)
  prometheus:
    <<: *restart
    profiles: ["obs"]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"  # scrape an API started with `uv run poe dev`
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    <<: *restart
    profiles: ["obs"]
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # local only (bound to 127.0.0.1): view without login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lexeu.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 256m
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  jaeger:
    <<: *restart
    profiles: ["obs"]
    # Jaeger v2 (OpenTelemetry Collector based), in-memory storage: traces are for debugging,
    # long-term LLM traces go to Langfuse.
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4317:4317"  # OTLP gRPC
      - "127.0.0.1:4318:4318"  # OTLP HTTP
    mem_limit: 256m

volumes:
  prometheus_data:
  grafana_data:
  qdrant_data:
  postgres_data:
  redis_data:
  object_data:
  hf_cache:
    name: lexeu_hf_cache  # shared model cache, survives `docker compose down -v` of other volumes
